set_remote_temperature:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: heatlink
          multiple: true
    temperature:
      required: false
      selector:
        number:
          min: -10
          max: 50
          step: 0.1
          unit_of_measurement: "°C"
          mode: box
    ttl:
      required: false
      default: 600
      selector:
        number:
          min: 60
          max: 3600
          unit_of_measurement: s
          mode: box